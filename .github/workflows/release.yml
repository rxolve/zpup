# Publishes what is not yet published: @zpup/core and @zpup/mcp to npm, then
# the MCP server's entry to the MCP Registry. It runs when a tag starting with
# "v" or "mcp-v" is pushed, or by hand from the Actions tab.
#
# Each step first checks whether its version is already out, so the workflow
# can be run again after a failure and a tag for one package does not
# republish the other.
#
# There are no tokens. npm accepts the publish because both packages name this
# file as a trusted publisher (package settings on npmjs.com, "Trusted
# Publisher"), and the MCP Registry accepts it because the workflow runs in
# the rxolve/zpup repository. Renaming this file breaks the first of those.
#
# Actions are pinned to commit SHAs; the comment after each is the release it
# points to.
name: Release

on:
  push:
    tags: ["v*", "mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC, for npm trusted publishing and the MCP Registry

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the library first, then the server.
      - run: pnpm --dir mcp run build

      - name: Check that the versions agree
        run: |
          set -euo pipefail
          mcp=$(node -p "require('./mcp/package.json').version")
          server=$(node -p "require('./mcp/server.json').version")
          package=$(node -p "require('./mcp/server.json').packages[0].version")
          if [ "$mcp" != "$server" ] || [ "$mcp" != "$package" ]; then
            echo "mcp/package.json is $mcp but mcp/server.json says $server and $package" >&2
            exit 1
          fi

      - name: Publish @zpup/core
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "@zpup/core@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "@zpup/core $version is already on npm"
            exit 0
          fi
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish "$RUNNER_TEMP/pack/zpup-core-$version.tgz" --access public

      - name: Publish @zpup/mcp
        run: |
          set -euo pipefail
          version=$(node -p "require('./mcp/package.json').version")
          if [ "$(npm view "@zpup/mcp@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "@zpup/mcp $version is already on npm"
            exit 0
          fi
          # Packing with pnpm writes the library's version in place of "workspace:^".
          pnpm --dir mcp pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish "$RUNNER_TEMP/pack/zpup-mcp-$version.tgz" --access public

      - name: See whether the MCP Registry has this version
        id: registry
        run: |
          set -euo pipefail
          version=$(node -p "require('./mcp/server.json').version")
          name=$(node -p "require('./mcp/server.json').name")
          listed=$(curl --fail --silent --show-error --get \
            --data-urlencode "search=$name" https://registry.modelcontextprotocol.io/v0/servers |
            jq --arg n "$name" --arg v "$version" \
              'any(.servers[]; .server.name == $n and .server.version == $v)')
          echo "listed=$listed" >> "$GITHUB_OUTPUT"
          echo "$name $version listed: $listed"

      # The Registry checks the package on npm, which takes a few minutes to
      # show a new version.
      - name: Wait for @zpup/mcp to show on npm
        if: steps.registry.outputs.listed != 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./mcp/package.json').version")
          for _ in $(seq 1 60); do
            if [ "$(npm view "@zpup/mcp@$version" version 2>/dev/null || true)" = "$version" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "@zpup/mcp $version did not show on npm within 10 minutes" >&2
          exit 1

      - name: Install cosign
        if: steps.registry.outputs.listed != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.listed != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.listed != 'true'
        working-directory: mcp
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
